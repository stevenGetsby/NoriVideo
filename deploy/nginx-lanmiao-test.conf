map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lanmiao-test.xyz www.lanmiao-test.xyz _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://lanmiao-test.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lanmiao-test.xyz;

    ssl_certificate /etc/letsencrypt/live/lanmiao-test.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanmiao-test.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://lanmiao-test.xyz$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name lanmiao-test.xyz;

    ssl_certificate /etc/letsencrypt/live/lanmiao-test.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanmiao-test.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2g;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8080 ssl default_server;
    listen [::]:8080 ssl default_server;
    server_name lanmiao-test.xyz www.lanmiao-test.xyz _;

    ssl_certificate /etc/letsencrypt/live/lanmiao-test.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lanmiao-test.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2g;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
