storage:
  type: tos
  tos:
    endpoint: https://tos-cn-beijing.volces.com
    publicEndpoint: https://tos-cn-beijing.volces.com
    region: cn-beijing
    bucket: nori-test
    accessKey: your-tos-access-key
    secretKey: your-tos-secret-key
    forcePathStyle: false

llm:
  providers:
    - id: deepseek
      name: DeepSeek 官方
      baseUrl: https://api.deepseek.com/v1
      apiKey: your-deepseek-api-key
    - id: kuaizi
      name: Kuaizi API
      baseUrl: https://aiopenapi.kuaizi.cn
      apiKey: your-kuaizi-api-key
  models:
    - modelId: deepseek-chat
      modelKey: deepseek::deepseek-chat
      name: DeepSeek Chat
      type: llm
      provider: deepseek
      llmProtocol: chat-completions
    - modelId: deepseek-reasoner
      modelKey: deepseek::deepseek-reasoner
      name: DeepSeek Reasoner
      type: llm
      provider: deepseek
      llmProtocol: chat-completions
    - modelId: seedream5.0lite
      modelKey: kuaizi::seedream5.0lite
      name: Seedream 5.0 Lite
      type: image
      provider: kuaizi
    - modelId: doubao-seedance-2-0-260128
      modelKey: kuaizi::doubao-seedance-2-0-260128
      name: Seedance 2.0
      type: video
      provider: kuaizi
    - modelId: speech-2.8-hd
      modelKey: kuaizi::speech-2.8-hd
      name: MiniMax Speech 2.8 HD
      type: audio
      provider: kuaizi
  defaultModels:
    analysisModel: nori::nori-gpt
    characterModel: nori::nori-image
    locationModel: nori::nori-image
    storyboardModel: nori::nori-image
    editModel: nori::nori-image
    videoModel: nori::seedance2.0
  modelRouting:
    nori::nori-gpt: deepseek::deepseek-chat
    nori::nori-gpt-max: deepseek::deepseek-reasoner
    nori::nori-gemini: deepseek::deepseek-reasoner
    nori::nori-deepseek: deepseek::deepseek-chat
    nori::nori-image: kuaizi::seedream5.0lite
    nori::seedance2.0: kuaizi::doubao-seedance-2-0-260128
    nori::nori-audio: kuaizi::speech-2.8-hd
