storage:
  type: tos
  tos:
    endpoint: https://tos-cn-beijing.volces.com
    publicEndpoint: https://tos-cn-beijing.volces.com
    region: cn-beijing
    bucket: your-tos-bucket
    accessKey: your-tos-access-key
    secretKey: your-tos-secret-key
    forcePathStyle: false

llm:
  providers:
    - id: ghc
      name: GHC API
      baseUrl: http://localhost:8313/v1
      apiKey: dummy
      gatewayRoute: openai-compat
    - id: hfsy
      name: HFSY API
      baseUrl: https://www.hfsyapi.cn/v1
      apiKey: your-hfsy-api-key
      gatewayRoute: openai-compat
    - id: deepseek
      name: DeepSeek 官方
      baseUrl: https://api.deepseek.com/v1
      apiKey: your-deepseek-api-key
      gatewayRoute: openai-compat
    - id: ark
      name: Volcengine Ark
      apiKey: your-ark-api-key
      gatewayRoute: official
  models:
    - modelId: gpt-5.5
      modelKey: ghc::gpt-5.5
      name: GHC GPT 5.5
      type: llm
      provider: ghc
      llmProtocol: responses
    - modelId: gemini-3.1-pro-preview
      modelKey: ghc::gemini-3.1-pro-preview
      name: GHC Gemini 3.1 Pro
      type: llm
      provider: ghc
      llmProtocol: responses
    - modelId: gpt-5.5
      modelKey: hfsy::gpt-5.5
      name: HFSY GPT 5.5
      type: llm
      provider: hfsy
      llmProtocol: chat-completions
    - modelId: gpt-image-2
      modelKey: hfsy::gpt-image-2
      name: HFSY GPT Image 2
      type: image
      provider: hfsy
    - modelId: gpt-5.6-terra
      modelKey: hfsy::gpt-5.6-terra
      name: HFSY GPT 5.6 Terra
      type: llm
      provider: hfsy
      llmProtocol: chat-completions
    - modelId: gpt-image-2pro
      modelKey: hfsy::gpt-image-2pro
      name: HFSY GPT Image 2 Pro
      type: image
      provider: hfsy
    - modelId: deepseek-chat
      modelKey: deepseek::deepseek-chat
      name: DeepSeek Chat
      type: llm
      provider: deepseek
      llmProtocol: chat-completions
    - modelId: doubao-seedance-2-0-260128
      modelKey: ark::doubao-seedance-2-0-260128
      name: Seedance 2.0
      type: video
      provider: ark
  defaultModels:
    analysisModel: nori::nori-gpt
    characterModel: nori::nori-image
    locationModel: nori::nori-image
    storyboardModel: nori::nori-image
    editModel: nori::nori-image
    videoModel: nori::seedance2.0
  modelRouting:
    nori::nori-gpt: ghc::gpt-5.5
    nori::nori-gpt-max: hfsy::gpt-5.6-terra
    nori::nori-gemini: ghc::gemini-3.1-pro-preview
    nori::nori-deepseek: deepseek::deepseek-chat
    nori::nori-image: hfsy::gpt-image-2
    nori::nori-image-pro: hfsy::gpt-image-2pro
    nori::seedance2.0: ark::doubao-seedance-2-0-260128
